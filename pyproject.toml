[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secscript"
version = "0.1.8"
description = "SecScript Programming Language"
requires-python = ">=3.10"

dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.14.5",
    "bcrypt==5.0.0",
    "beautifulsoup4==4.15.0",
    "cryptography==50.0.1",
    "dnspython==2.8.0",
    "invoke==3.0.3",
    "lark==1.3.1",
    "mac-vendor-lookup==0.1.15",
    "paramiko==5.0.0",
    "requests==2.34.2",
    "rich==15.0.0",
    "scapy==2.7.0",
]

[project.scripts]
seclang = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "utills*", "fileio*", "security*"]