[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secscript"
version = "0.1.0"
description = "SecScript Programming Language"
requires-python = ">=3.10"

[project.scripts]
seclang = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "utills*", "fileio*", "security*"]